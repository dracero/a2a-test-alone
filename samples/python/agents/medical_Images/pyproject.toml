[project]
name = "medical-images"
version = "0.1.0"
description = "Agente de procesamiento de imágenes médicas utilizando Google Gemini y Tavily."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "a2a-sdk>=0.3.2",
    "click>=8.1.7,<8.2",
    "httpx>=0.28.1",
    "langchain>=0.3.27",
    "langchain-community>=0.3.27",
    "langchain-groq>=0.2.0",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "python-dotenv>=1.1.1",
    "sse-starlette>=3.0.2",
    "starlette>=0.47.2",
    "tavily-python>=0.7.12",
    "uvicorn>=0.35.0",
    "langgraph>=0.0.1",
    "qdrant-client>=1.15.1",
    "fastembed>=0.2.5",
    "colpali-engine>=0.1.0",
    "pypdf2>=3.0.1",
    "pymupdf>=1.24.0",
    "pdf2image>=1.17.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "transformers>=4.46.3",
    "accelerate>=0.26.0",
    "bitsandbytes>=0.42.0",
    "sentence-transformers",
    "nest-asyncio>=1.5.8",
]

[project.scripts]
medical_Images = "app.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

