[project]
name = "a2a-python-example-ui"
version = "0.1.0"
description = "A2A backend server for multi-agent orchestration"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.11.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "a2a-sdk>=0.3.0,<1.0.0",
    "beeai-framework[a2a]>=0.1.0",
    "neo4j-agent-memory>=0.4.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "langchain-core>=0.3.0",
    "google-adk>=2.3.0",
    "sentence-transformers>=5.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["service"]

[dependency-groups]
dev = ["ruff>=0.11.2"]
